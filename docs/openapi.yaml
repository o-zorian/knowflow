openapi: 3.1.0
info:
  title: KnowFlow API
  version: 1.0.0
  description: Owner-scoped knowledge-base ingestion, grounded chat, evaluation governance, and health API.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker Compose
tags:
  - name: Health
  - name: Auth
  - name: Knowledge bases
  - name: Documents
  - name: Conversations
  - name: Admin
paths:
  /metrics:
    get:
      tags: [Health]
      operationId: getPrometheusMetrics
      security: []
      servers:
        - url: http://localhost:8080
          description: Metrics endpoint is outside the API version prefix
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/TokenPair' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Error' }
  /knowledge-bases:
    get:
      tags: [Knowledge bases]
      operationId: listKnowledgeBases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated owner-scoped knowledge bases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/KnowledgeBasePage' }
    post:
      tags: [Knowledge bases]
      operationId: createKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeBaseInput' }
      responses:
        '201': { $ref: '#/components/responses/KnowledgeBase' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /knowledge-bases/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Knowledge bases]
      operationId: getKnowledgeBase
      responses:
        '200': { $ref: '#/components/responses/KnowledgeBase' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Knowledge bases]
      operationId: updateKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeBaseInput' }
      responses:
        '200': { $ref: '#/components/responses/KnowledgeBase' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Knowledge bases]
      operationId: deleteKnowledgeBase
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /knowledge-bases/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Documents]
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Documents]
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document accepted and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          document: { $ref: '#/components/schemas/Document' }
                          duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /documents/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Documents]
      operationId: getDocument
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /documents/{id}/chunks:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Documents]
      operationId: listDocumentChunks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /documents/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Documents]
      operationId: retryDocument
      responses:
        '202': { $ref: '#/components/responses/Document' }
        '409': { $ref: '#/components/responses/Error' }
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Conversations]
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledge_base_id]
              properties:
                knowledge_base_id: { type: string, format: uuid }
                title: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Conversation' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Conversations]
      operationId: getConversation
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Conversations]
      operationId: streamMessage
      description: Streams named SSE events with JSON data. Events are message.started, retrieval.completed, message.delta, citation, usage, message.completed, and error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /admin/metrics/summary:
    get:
      tags: [Admin]
      operationId: getAdminSummary
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/ingestion-jobs:
    get:
      tags: [Admin]
      operationId: listAdminIngestionJobs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, default: failed }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/model-usage:
    get:
      tags: [Admin]
      operationId: listAdminModelUsage
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Admin]
      operationId: setUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, default: 20 }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Unified error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TokenPair:
      description: Access and refresh tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
    User:
      description: Current user
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/User' }
    KnowledgeBase:
      description: Knowledge base
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/KnowledgeBase' }
    Document:
      description: Document and latest ingestion job
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Document' }
    Conversation:
      description: Conversation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Conversation' }
  schemas:
    Envelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: { type: string, format: uuid }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string, format: uuid }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    RefreshToken:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    User:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        access_token_expires_in: { type: integer }
        refresh_token_expires_in: { type: integer }
        user: { $ref: '#/components/schemas/User' }
    RetrievalConfig:
      type: object
      required: [chunk_size, chunk_overlap, dense_top_k, sparse_top_k, rerank_top_k, final_top_k, minimum_score, rrf_k, rerank_enabled]
      properties:
        chunk_size: { type: integer, minimum: 1, default: 800 }
        chunk_overlap: { type: integer, minimum: 0, default: 120 }
        dense_top_k: { type: integer, minimum: 0, default: 20 }
        sparse_top_k: { type: integer, minimum: 0, default: 20 }
        rerank_top_k: { type: integer, minimum: 1, default: 10 }
        final_top_k: { type: integer, minimum: 1, default: 5 }
        minimum_score: { type: number, default: 0 }
        rrf_k: { type: integer, minimum: 1, default: 60 }
        rerank_enabled: { type: boolean, default: false }
    KnowledgeBaseInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        embedding_model: { type: string }
        retrieval_config: { $ref: '#/components/schemas/RetrievalConfig' }
    KnowledgeBase:
      allOf:
        - $ref: '#/components/schemas/KnowledgeBaseInput'
        - type: object
          required: [id, owner_id, embedding_dimension, document_count, ready_chunk_count]
          properties:
            id: { type: string, format: uuid }
            owner_id: { type: string, format: uuid }
            embedding_dimension: { type: integer, const: 1024 }
            document_count: { type: integer }
            ready_chunk_count: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    KnowledgeBasePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeBase' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    IngestionJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempts: { type: integer }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
    Document:
      type: object
      required: [id, knowledge_base_id, filename, mime_type, size_bytes, status, chunk_count, index_version]
      properties:
        id: { type: string, format: uuid }
        knowledge_base_id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [uploaded, queued, parsing, chunking, embedding, ready, failed, deleting] }
        chunk_count: { type: integer }
        index_version: { type: integer }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        job: { oneOf: [{ $ref: '#/components/schemas/IngestionJob' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, user_id, knowledge_base_id, title]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        knowledge_base_id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
security:
  - bearerAuth: []
