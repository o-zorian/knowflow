name: knowflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowflow-dev-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-knowflow-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-knowflow-dev-password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-knowflow-dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-knowflow-dev-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowflow}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

  api:
    build:
      context: .
    command: ["/usr/local/bin/api"]
    environment: &app-environment
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-knowflow}:${POSTGRES_PASSWORD:-knowflow-dev-password}@postgres:5432/${POSTGRES_DB:-knowflow}?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-knowflow-dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-knowflow-dev-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowflow}
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-before-production}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-2h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: "1024"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      VIKINGDB_AK: ${VIKINGDB_AK:-}
      VIKINGDB_SK: ${VIKINGDB_SK:-}
      VIKINGDB_HOST: ${VIKINGDB_HOST:-}
      VIKINGDB_REGION: ${VIKINGDB_REGION:-}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-3}
      CHAT_INPUT_COST_PER_MILLION_USD: ${CHAT_INPUT_COST_PER_MILLION_USD:-0}
      CHAT_OUTPUT_COST_PER_MILLION_USD: ${CHAT_OUTPUT_COST_PER_MILLION_USD:-0}
      EMBEDDING_COST_PER_MILLION_USD: ${EMBEDDING_COST_PER_MILLION_USD:-0}
      RERANK_COST_PER_MILLION_USD: ${RERANK_COST_PER_MILLION_USD:-0}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-120}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-30s}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      WORKER_HEALTH_INTERVAL: ${WORKER_HEALTH_INTERVAL:-30s}
      WORKER_POLL_TIMEOUT: ${WORKER_POLL_TIMEOUT:-2s}
      INGESTION_JOB_TIMEOUT: ${INGESTION_JOB_TIMEOUT:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://localhost:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["/usr/local/bin/worker"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
    command: ["/usr/local/bin/web"]
    environment:
      WEB_ADDR: :8081
      WEB_ROOT: /app/web
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  smoke:
    profiles: ["tools"]
    build:
      context: .
    command: ["/usr/local/bin/smoke", "-base-url", "http://api:8080/api/v1", "-document", "/app/demo/knowflow-demo.md"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: "no"

  eval:
    profiles: ["tools"]
    build:
      context: .
    command: ["/usr/local/bin/eval", "-dataset", "/app/eval/datasets/knowflow-m5.jsonl", "-json", "/app/eval/results/m5-comparison.json", "-markdown", "/app/eval/results/m5-comparison.md"]
    environment:
      <<: *app-environment
      CHAT_INPUT_COST_PER_MILLION_USD: ${EVAL_CHAT_INPUT_COST_PER_MILLION_USD:-0.15}
      CHAT_OUTPUT_COST_PER_MILLION_USD: ${EVAL_CHAT_OUTPUT_COST_PER_MILLION_USD:-0.60}
      EMBEDDING_COST_PER_MILLION_USD: ${EVAL_EMBEDDING_COST_PER_MILLION_USD:-0.02}
      RERANK_COST_PER_MILLION_USD: ${EVAL_RERANK_COST_PER_MILLION_USD:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./eval/results:/app/eval/results
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
